# Local services only. Spark runs in-process and Ollama runs natively on the host —
# both deliberate, see docs/decisions/ADR-0002.
name: signal

x-airflow-common: &airflow-common
  # Stock Airflow has no JVM and no pyspark; ADR-0002 runs Spark in-process, so the
  # scheduler's container is where the commit job executes. See Dockerfile.airflow.
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: signal/airflow:3.0.2
  # Run as the host user, which is what Airflow's own compose recommends and what makes
  # the mounts work in both directions: files written into ./data and ./out are owned by
  # you rather than by uid 50000, and — the reason it is not optional here — ~/.aws is
  # 0600 owned by the host user, so a container running as 50000 cannot read it and
  # botocore reports "unable to locate credentials" rather than a permission error.
  # Group 0 because the image makes /home/airflow group-writable for exactly this.
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Airflow pauses a newly-discovered DAG by default, and that default cost 4A its entire
    # acceptance: `brief`, `market` and `maintenance` were built, merged, deployed and never
    # ran once, because nobody unpaused them. Nothing surfaced it — the AWS half kept
    # ingesting, bronze kept filling, and the one thing SPEC §12's 4A gate turns on (a mail
    # at 07:00) had simply never happened. See docs/runbooks/phase-4b.md.
    #
    # The trade is real and it goes the other way for a half-written DAG: the dag-processor
    # picks up file changes within seconds, so a DAG now starts running as soon as it is
    # saved. That is the lesser failure — a run that fails loudly beats a phase that quietly
    # was never running, and `catchup=False` on every DAG here bounds what a premature start
    # can do to one interval.
    #
    # Note this only affects DAGs discovered *after* it is set. Anything already in the
    # metadata DB keeps whatever paused state it has.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    # Airflow 3 runs tasks against the Task Execution API rather than in-process, and the
    # default points at localhost:8080 — which, inside the scheduler container, is
    # nothing. Without this every task dies with "Connection refused" before it can open
    # a log file, so the run fails with an empty log and no traceback.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Scheduler and api-server have to agree on the token secret; left unset each process
    # invents its own and the workers are rejected. Local-only stack, hence a default.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-signal-local-dev}
    PYTHONPATH: /opt/signal/src
    # The DAGs folder is a bind mount from the host, so bytecode written there is written
    # into the repo — by a container uid the host user does not own. `airflow/dags/__pycache__`
    # ended up owned by uid 50000, which made `make clean` exit non-zero on every run and
    # left a directory nobody could delete without root. The Lambda package already sets
    # this for its own reasons; the DAGs folder needs it for this one.
    PYTHONDONTWRITEBYTECODE: "1"
    # Ollama is on the host, not in this network.
    SIGNAL_OLLAMA_URL: ${SIGNAL_OLLAMA_URL:-http://host.docker.internal:11434}

    # Absolute, because Airflow tasks run with cwd=/opt/airflow and the defaults in
    # config.py are relative — a relative cache root would scatter downloaded staging
    # objects into the Airflow home and re-pay the egress on the next run (SPEC §10.1).
    SIGNAL_DATA_ROOT: /opt/signal/data
    SIGNAL_OUT_ROOT: /opt/signal/out
    SIGNAL_CACHE_ROOT: /opt/signal/.cache
    SIGNAL_ENTITY_DICTIONARY_PATH: /opt/signal/warehouse/entities/dictionary.json.gz
    SIGNAL_CONTACT_EMAIL: ${SIGNAL_CONTACT_EMAIL:-you@example.com}

    # Phase 1 targets. Terraform prints all three as outputs.
    SIGNAL_BRONZE_BUCKET: ${SIGNAL_BRONZE_BUCKET:-signal-bronze}
    SIGNAL_ICEBERG_WAREHOUSE: ${SIGNAL_ICEBERG_WAREHOUSE:-}
    SIGNAL_STATE_TABLE_NAME: ${SIGNAL_STATE_TABLE_NAME:-signal-pipeline-state}
    AWS_REGION: ${AWS_REGION:-us-east-1}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./src:/opt/signal/src
    - ./data:/opt/signal/data
    - ./out:/opt/signal/out
    # The committed entity dictionary the resolver reads (SPEC §7.2). Read-only: it is a
    # build artifact of `signal dictionary`, checked into the repo, and nothing at runtime
    # writes to it. Without this mount the `resolve` DAG cannot find its dictionary at all.
    - ./warehouse:/opt/signal/warehouse:ro
    # The read-once staging cache. A bind mount rather than a named volume so the host
    # and the containers share one cache: a staged object downloaded by a local
    # `uv run` job is a byte the DAG then does not re-pay for, which is the whole point
    # of SPEC §10.1. (A named volume is also created root-owned, which a container
    # running as your uid cannot write.)
    - ./.cache:/opt/signal/.cache
    # Iceberg's Spark runtime jar, resolved from Maven on first session. Cached so every
    # container start does not re-download it. Bind-mounted for the same ownership reason
    # as the staging cache above.
    - ./.cache/ivy2:/home/airflow/.ivy2
    # Read-only, and never copied: the AWS CLI's own credential store is the single place
    # these live. This is why compose is run from inside WSL — `${HOME}` has to be the
    # Linux home holding ~/.aws, and a \wsl$\ UNC path is not a usable bind source.
    - ${HOME}/.aws:/home/airflow/.aws:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"   # required on Linux; harmless on WSL2
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    # No entrypoint override. The image's entrypoint is what gives an arbitrary uid a
    # passwd entry, and without one Airflow refuses to run at all ("the user that Airflow
    # is running as has no username") — which only shows up once `user:` is set.
    #
    # `airflow users create` used to be here too. It is an Airflow 2 command and does not
    # exist in 3: SimpleAuthManager takes its users from
    # AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS (username:role) and generates the password
    # itself. It had been failing on every start, silently, behind a `|| true`.
    # `make airflow-password` prints the current one.
    command: db migrate
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports: ["8080:8080"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
