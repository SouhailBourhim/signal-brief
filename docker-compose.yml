# Local services only. Spark runs in-process and Ollama runs natively on the host —
# both deliberate, see docs/decisions/ADR-0002.
name: signal

x-airflow-common: &airflow-common
  # Stock Airflow has no JVM and no pyspark; ADR-0002 runs Spark in-process, so the
  # scheduler's container is where the commit job executes. See Dockerfile.airflow.
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: signal/airflow:3.0.2
  # Run as the host user, which is what Airflow's own compose recommends and what makes
  # the mounts work in both directions: files written into ./data and ./out are owned by
  # you rather than by uid 50000, and — the reason it is not optional here — ~/.aws is
  # 0600 owned by the host user, so a container running as 50000 cannot read it and
  # botocore reports "unable to locate credentials" rather than a permission error.
  # Group 0 because the image makes /home/airflow group-writable for exactly this.
  user: "${AIRFLOW_UID:-50000}:0"
  # Survives a WSL/Docker restart unattended: the brief DAG fires at a clock time (16:00),
  # not on demand, so a container that stays down after a host reboot silently costs a
  # day's email with nothing to alert on it. Note this does NOT cover the host itself
  # sleeping — the containers are then frozen rather than stopped, and Docker still reports
  # them `Up`; see brief_dag.py for the 2026-08-24 incident that moved the send to 16:00.
  # airflow-init overrides this below — it's a one-shot migration job, not a long-running
  # service, and should never restart.
  restart: unless-stopped
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Airflow pauses a newly-discovered DAG by default, and that default cost 4A its entire
    # acceptance: `brief`, `market` and `maintenance` were built, merged, deployed and never
    # ran once, because nobody unpaused them. Nothing surfaced it — the AWS half kept
    # ingesting, bronze kept filling, and the one thing SPEC §12's 4A gate turns on (a mail
    # at 16:00) had simply never happened. See docs/runbooks/phase-4b.md.
    #
    # The trade is real and it goes the other way for a half-written DAG: the dag-processor
    # picks up file changes within seconds, so a DAG now starts running as soon as it is
    # saved. That is the lesser failure — a run that fails loudly beats a phase that quietly
    # was never running, and `catchup=False` on every DAG here bounds what a premature start
    # can do to one interval.
    #
    # Note this only affects DAGs discovered *after* it is set. Anything already in the
    # metadata DB keeps whatever paused state it has.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    # Airflow 3 runs tasks against the Task Execution API rather than in-process, and the
    # default points at localhost:8080 — which, inside the scheduler container, is
    # nothing. Without this every task dies with "Connection refused" before it can open
    # a log file, so the run fails with an empty log and no traceback.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Scheduler and api-server have to agree on the token secret; left unset each process
    # invents its own and the workers are rejected. Local-only stack, hence a default.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-signal-local-dev}
    # The same failure as the JWT secret above, one layer down. Left unset, every container
    # generates its own fernet key into its own airflow.cfg — measured 2026-08-30, the
    # scheduler, api-server and dag-processor each held a different one. A Variable written
    # by a task through the api-server then reads back from the scheduler as
    # "does not exist" rather than as a decryption error, and `--force-recreate` silently
    # invalidates every stored value at once.
    #
    # `brief_dag`'s "already sent today" marker is a Variable, so this is precisely what
    # stops a restart from re-mailing the day's brief. Local-only stack protecting no real
    # secret (the macro API key lives in SSM, not here), hence a committed default —
    # override per-machine with AIRFLOW_FERNET_KEY in .env, as .env.example describes.
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-x4HVl5Kha-_vT7CqcicQPn8jYN3COjqKyHCM26WxqwY=}
    PYTHONPATH: /opt/signal/src
    # The DAGs folder is a bind mount from the host, so bytecode written there is written
    # into the repo — by a container uid the host user does not own. `airflow/dags/__pycache__`
    # ended up owned by uid 50000, which made `make clean` exit non-zero on every run and
    # left a directory nobody could delete without root. The Lambda package already sets
    # this for its own reasons; the DAGs folder needs it for this one.
    PYTHONDONTWRITEBYTECODE: "1"
    # Ollama is on the host, not in this network — so `localhost` means two different
    # machines depending on which side of the container wall you are standing on, and the
    # `.env` that gets this right locally gets it exactly wrong here.
    #
    # **Deliberately NOT `${SIGNAL_OLLAMA_URL:-…}`.** Compose interpolates `${VAR}` from the
    # project `.env` *before* the container starts, so `SIGNAL_OLLAMA_URL=http://localhost:11434`
    # — correct for `uv run signal enrich` — silently replaced this default with an address
    # that resolves to the container itself. Every enrichment task would have failed with
    # `OllamaUnavailable` against a URL nobody set on purpose. Found 2026-08-23, the same day
    # `resolve` turned out not to be able to see its dictionary: same shape, same cause.
    #
    # The override lives under a different name so it cannot collide with the local setting.
    # Native Linux Docker (not Desktop) usually wants http://172.17.0.1:11434.
    SIGNAL_OLLAMA_URL: ${COMPOSE_OLLAMA_URL:-http://host.docker.internal:11434}
    # These *are* interpolated from `.env`, and that is correct: unlike the URL, a model tag
    # and a digest name the same thing on both sides of the container wall. Missing them is
    # how the first `enrich` DAG run failed — the container saw `UNPINNED` and refused, while
    # the same code from a shell had the pin from `.env`. A guard doing its job against a
    # config gap, which is a better failure than the alternative but still a gap.
    SIGNAL_OLLAMA_MODEL: ${SIGNAL_OLLAMA_MODEL:-llama3.1:8b}
    SIGNAL_OLLAMA_MODEL_DIGEST: ${SIGNAL_OLLAMA_MODEL_DIGEST:-UNPINNED}

    # Absolute, because Airflow tasks run with cwd=/opt/airflow and the defaults in
    # config.py are relative — a relative cache root would scatter downloaded staging
    # objects into the Airflow home and re-pay the egress on the next run (SPEC §10.1).
    SIGNAL_DATA_ROOT: /opt/signal/data
    SIGNAL_OUT_ROOT: /opt/signal/out
    SIGNAL_CACHE_ROOT: /opt/signal/.cache
    SIGNAL_ENTITY_DICTIONARY_PATH: /opt/signal/warehouse/entities/dictionary.json.gz
    SIGNAL_CONTACT_EMAIL: ${SIGNAL_CONTACT_EMAIL:-you@example.com}

    # Phase 1 targets. Terraform prints all three as outputs.
    SIGNAL_BRONZE_BUCKET: ${SIGNAL_BRONZE_BUCKET:-signal-bronze}
    SIGNAL_ICEBERG_WAREHOUSE: ${SIGNAL_ICEBERG_WAREHOUSE:-}
    SIGNAL_STATE_TABLE_NAME: ${SIGNAL_STATE_TABLE_NAME:-signal-pipeline-state}
    AWS_REGION: ${AWS_REGION:-us-east-1}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    # Task logs, on the host rather than inside the container. Without this they live only
    # in the container's own filesystem, so `--force-recreate` destroys them — on
    # 2026-08-30 a `maintenance.sweep` failure left a task_instance row in Postgres and no
    # log at all to say why. The log of the run that made you restart is exactly the log a
    # restart must not take with it.
    - ./airflow/logs:/opt/airflow/logs
    - ./src:/opt/signal/src
    - ./data:/opt/signal/data
    - ./out:/opt/signal/out
    # The committed entity dictionary the resolver reads (SPEC §7.2). Read-only: it is a
    # build artifact of `signal dictionary`, checked into the repo, and nothing at runtime
    # writes to it. Without this mount the `resolve` DAG cannot find its dictionary at all.
    - ./warehouse:/opt/signal/warehouse:ro
    # The read-once staging cache. A bind mount rather than a named volume so the host
    # and the containers share one cache: a staged object downloaded by a local
    # `uv run` job is a byte the DAG then does not re-pay for, which is the whole point
    # of SPEC §10.1. (A named volume is also created root-owned, which a container
    # running as your uid cannot write.)
    - ./.cache:/opt/signal/.cache
    # Iceberg's Spark runtime jar, resolved from Maven on first session. Cached so every
    # container start does not re-download it. Bind-mounted for the same ownership reason
    # as the staging cache above.
    - ./.cache/ivy2:/home/airflow/.ivy2
    # Read-only, and never copied: the AWS CLI's own credential store is the single place
    # these live. This is why compose is run from inside WSL — `${HOME}` has to be the
    # Linux home holding ~/.aws, and a \wsl$\ UNC path is not a usable bind source.
    - ${HOME}/.aws:/home/airflow/.aws:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"   # required on Linux; harmless on WSL2
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    # No entrypoint override. The image's entrypoint is what gives an arbitrary uid a
    # passwd entry, and without one Airflow refuses to run at all ("the user that Airflow
    # is running as has no username") — which only shows up once `user:` is set.
    #
    # `airflow users create` used to be here too. It is an Airflow 2 command and does not
    # exist in 3: SimpleAuthManager takes its users from
    # AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS (username:role) and generates the password
    # itself. It had been failing on every start, silently, behind a `|| true`.
    # `make airflow-password` prints the current one.
    # `db migrate`, but not before the DAGs bind mount is actually there.
    #
    # Docker Desktop restarts this stack at boot with `restart: unless-stopped`, and on
    # WSL2 it can beat the host filesystem to it. On 2026-08-30 it did: every bind mount
    # resolved to an empty directory, so Airflow came up with zero DAGs and stayed that
    # way for eight hours, reporting `Up` the whole time while nothing ran. A fresh
    # container mounting the same path saw all twelve files — the paths were right, the
    # timing was not. `restart:` cannot help, because nothing had crashed.
    #
    # Every service below waits on this one completing successfully, so blocking here is
    # what stops the stack from coming up DAG-less. Waiting rather than failing outright
    # because the race resolves on its own within seconds; failing after 150s because a
    # stack that refuses to start is debuggable and one that runs empty is not.
    command:
      - bash
      - -c
      - |
        for attempt in $$(seq 1 30); do
          if compgen -G '/opt/airflow/dags/*.py' > /dev/null; then
            exec airflow db migrate
          fi
          echo "dags mount still empty (attempt $$attempt/30) — waiting for the host filesystem"
          sleep 5
        done
        echo "FATAL: /opt/airflow/dags empty after 150s — refusing to start a DAG-less stack"
        exit 1
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    # Loopback, not all interfaces. `8080:8080` publishes to 0.0.0.0, and this container
    # mounts `~/.aws` read-only (see the volumes block) while its JWT secret defaults to the
    # literal `signal-local-dev` — so on any shared or café network, a bare `8080:8080` is a
    # path from a stranger's browser to real AWS credentials. This is a local development
    # stack and nothing off-host is meant to reach it.
    #
    # Overridable for the case that does need it — a VM, a remote Docker host, WSL2 reached
    # from Windows — by setting AIRFLOW_BIND to 0.0.0.0, which makes exposure a deliberate
    # act rather than the default.
    ports: ["${AIRFLOW_BIND:-127.0.0.1}:8080:8080"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
