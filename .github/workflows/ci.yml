name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Spark 4 requires Java 17+. The skeleton's normalize stage runs on Spark here,
      # which is the point: CI is where the toolchain gets verified on a machine that is
      # not the author's.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - run: uv sync --all-extras

      # `make lint` and `make test`, not the underlying commands. CI used to spell out
      # `ruff check` and `ruff format --check` itself, which silently dropped the `mypy src`
      # that `make lint` had gained — a configured gate that never ran. Calling the target
      # is what stops the Makefile and CI drifting apart again: a gate added in one place
      # now runs in both, which is the property being bought, not the brevity.
      - name: lint (ruff + mypy)
        run: make lint

      # Carries the coverage gate — see `fail_under` in pyproject.toml.
      - name: test
        run: make test

      - name: walking skeleton (clean clone, with Spark)
        run: uv run signal skeleton

      - name: brief was actually produced
        run: |
          test -f out/brief-*.html || { echo "no brief rendered"; exit 1; }
          grep -q "pipeline:" out/brief-*.html || { echo "health footer missing"; exit 1; }

      # SPEC §11: an accuracy regression fails the build.
      - name: eval gates
        run: uv run python evals/score.py --gate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brief
          path: out/*.html

  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC — ADR-0005: no long-lived AWS keys, ever
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"

      # The poller Lambdas are zipped from build/lambda by `data.archive_file`, so it has
      # to exist before plan or validate — there is no artifact-less plan. Cheap: three
      # pure-Python wheels and a copy, ~11 MB (ADR-0006).
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: make lambda-package

      - run: terraform -chdir=infra/terraform/bootstrap fmt -check
      - run: terraform -chdir=infra/terraform/main fmt -check
      - run: terraform -chdir=infra/terraform/main init -backend=false
      - run: terraform -chdir=infra/terraform/main validate

      # Same-repo events only: forked PRs don't get this role's OIDC trust (the
      # role's trust policy is scoped by GitHub's immutable owner/repo IDs — see
      # ADR-0005 — to this repo only), and that's the point: a fork can't plan
      # against this AWS account.
      - if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::481879233905:role/signal-brief-gha-terraform-plan
          aws-region: us-east-1

      # -lock=false: the role is deliberately ReadOnlyAccess (ADR-0005), which
      # can't PutObject the S3-native lock file either — and shouldn't need to,
      # since this plan never applies. Locking still applies to local dev applies.
      - if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          terraform -chdir=infra/terraform/main init -reconfigure -lock=false
          terraform -chdir=infra/terraform/main plan -lock=false
