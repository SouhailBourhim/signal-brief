# Accuracy floors enforced by `make eval` and by CI on every PR (SPEC §11).
#
# These ratchet UP as real labeled data arrives; they never ratchet down to accommodate a
# regression. Lowering a floor is a decision that belongs in an ADR, not in a commit that
# is trying to go green.

[dedup_fixture]   # SPEC §7.1 — the 55 synthetic Phase 0 pairs, unchanged
# The floors this file has always carried, now pointed at the set they were actually
# measured on. The fixture's `story_key` IS its ground truth, so 1.00/1.00 is expected and
# this section is a canary: it proves the scorer still runs. It is not evidence that the
# clustering is good, and it is scored separately so it cannot be mistaken for evidence of
# that. It earned its keep in 3.B: it caught a mid-work regression — a rewrite the real
# corpus is too thin to test — that the real set scored right through.
#
# **Ratcheted to 1.000 in 3.E**, from 0.90. The real sets' floors sit below their measured
# values to absorb sampling noise; this one has none to absorb. The fixture is synthetic and
# its `story_key` *is* the label, so there is no draw that could have gone differently, and
# anything under perfect is a regression by definition. `fit_thresholds.py`'s hard filter was
# raised to match, so the fitter cannot choose a configuration this gate would then reject.
min_precision = 1.00
min_recall    = 1.00

[dedup]           # SPEC §7.1 — 252 real pairs from silver.articles, labeled 2026-08-20
# Fitted in 3.B by `evals/fit_thresholds.py`: grid search on a train split, the precision
# constraint chosen by cross-validation inside that split, reported on a held-out half the
# fitting never saw.
#
#                        precision   recall
#     train (fitted on)     0.933     0.636
#     HELD OUT              1.000     0.500     <- the honest estimate
#     full set              0.962     0.568     <- what `make eval` gates on, below
#
# Phase 0 scored 0.000 / 0.455 on the same pairs. The floors gate the full set because that
# is what the scorer sees, and they sit just under it: they exist to catch a regression, not
# to certify the number. Quote the held-out row.
#
# The single remaining false positive is two different Show HN projects sharing the phrase
# "Claude Code sessions" — a genuine miss, not a labeling artifact.
#
# These labels were made by an LLM assistant and then reviewed by the reader, who overrode
# three of them; `labeler` is stamped on every record and `reviewed_from` on every overridden
# one. That caveat is carried into the README rather than left here: see
# docs/runbooks/phase-3.md 3.A.
#
# **Re-run in 3.E**, after 3.D changed `NEAR_DUPLICATE_DISTANCE` without re-fitting. The rows
# above are unchanged; the CV now selects constraint **0.85** rather than 3.B's 0.90, so that
# figure had gone stale without anything noticing.
#
# 3.E also measured how much of this fit is actually the data. Of the four constants the grid
# searches, the labeled set determines one: `TITLE_JACCARD` is 0.35 at every feasible point,
# `MIN_TITLE_TOKENS` is what moves the held-out row (4 gives 1.000/0.500; 2 or 3 give
# 0.857/0.545), and `BODY_JACCARD` and `MIN_BODY_TOKENS` score identically at every value on
# both splits — and the body branch fires zero times in 200,000 random real pairs, so the
# corpus cannot separate them either. The fit now reports that in its own output and breaks
# ties by keeping what `dedup.py` ships. Tuple order had been breaking them, and had been
# recommending the simhash distance 3.D removed for chaining a 45-article false cluster.
#
# **The 0.500 held-out recall ceiling is now refused, not deferred (ADR-0017, 5.C).** The
# embedding branch ADR-0009 §1 adopted was re-measured through the vehicle that actually ships
# (ADR-0016) and does not survive: no threshold at or above 0.90 changes a single decision, and
# 0.85 — the only one that buys recall, 0.568 -> 0.705 — emits **4,841 false edges across 1,680
# heads** in one window. A spanning tree of 1,680 nodes needs 1,679. That is 3.B's 59%
# mega-cluster arriving again, and it is why the number below is unchanged.
#
# The merges concentrate on templated filing titles (`424B2 - BANK OF NOVA SCOTIA` against
# `424B2 - BANK OF MONTREAL /CAN/`), which a retrieval encoder is correct to score as similar
# and which this corpus is 64% made of. The ceiling is a property of the corpus and the alias
# index, not of the matching rule.
#
# **The floors are not ratcheted, deliberately.** They sit 0.012 and 0.018 under the full set.
# One labeled pair is worth ~0.023 of recall here, so a floor any closer fails the build on a
# single re-labeled example — a tripwire on labeling rather than on accuracy. A floor
# ratchets when the measurement improves, not when the slack looks untidy.
min_precision = 0.95
min_recall    = 0.55

[entities]        # SPEC §7.2 — 300 real mentions from silver.articles, labeled 2026-08-20
# Fitted in 3.C by `evals/fit_thresholds.py --set entities`, against the committed
# dictionary snapshot (`warehouse/entities/dictionary.json.gz`, SEC + Wikidata).
#
#                        precision   recall
#     train (fitted on)     0.900     0.667
#     HELD OUT              0.833     0.556     <- the honest estimate
#     full set              0.868     0.611     <- what `make eval` gates on, below
#
# Quote the held-out row. The floors gate the full set because that is what the scorer sees,
# and they sit just under it: they catch a regression, they do not certify the number.
#
# Two deviations from how `[dedup]` was fitted, both forced by measurement rather than taste
# and both written up in docs/runbooks/phase-3.md 3.C:
#
# 1. **The precision constraint is stated, not cross-validated.** Entity precision is
#    monotone in a single knob, so "the strictest constraint that survives CV" always picks
#    the strictest grid point — a resolver that reads CIKs out of EDGAR titles and ignores
#    prose, at recall 0.185. See `ENTITY_MIN_PRECISION` in the fitter.
# 2. **The objective is F1 under that constraint, not recall.** Dedup maximises recall
#    because a false merge deletes a story invisibly. A mention filed under the wrong company
#    is something the reader sees, so the trade is real both ways. Maximising recall here
#    rode the constraint boundary — train precision 0.760, held out 0.615 — and walked past
#    a knee one step away.
#
# Only `CONFIDENCE_FLOOR` is fitted. 27 positive mentions in the train half cannot certify a
# second interacting constant: searching two of them picked a value that bought +0.037 train
# recall and cost held-out precision 0.833 -> 0.727.
#
# The remaining recall gap is named rather than mysterious. `Meta` and `Apple` are ordinary
# English words the resolver will not link on the word alone, and that is SPEC §7.2's
# embedding stage, not a threshold.
#
# Same caveat as `[dedup]`: these labels were made by an LLM assistant and reviewed by the
# reader. See docs/runbooks/phase-3.md 3.A.
#
# Not ratcheted in 3.E, for the reason under `[dedup]`: 54 positive mentions put one example
# at ~0.019 of recall, and these floors already sit 0.048 and 0.031 below the full set.
min_precision = 0.82
min_recall    = 0.58

[enrichment]      # SPEC §7.3 — 100 drawn, 95 distinct, labeled 2026-08-29 (5.0)
# Carried from 4B.G, where the harness was built and never run. Scored against
# llama3.1:8b @ sha256:667b0c1932bc… under prompt v1; the stamp is on every prediction row,
# so a model swap leaves these numbers visibly attributed to the old model rather than
# silently re-earned.
#
#                        precision   recall
#     full set (n=95)      0.747      0.782    <- what `make eval` gates on, below
#
# There is no train/held-out split here, and that is a real difference from `[dedup]` and
# `[entities]`. Nothing is *fitted* against this set — no threshold is searched, no constant
# is chosen. The prompt and the schema were written before the labels existed, so the whole
# set is held out in the only sense that matters, and splitting it would halve the sample to
# defend against an overfit that has no mechanism to occur.
#
# ## What the number is made of, because the headline hides the interesting half
#
#     topic exact match     75/95 = 0.789
#     summary entailed      81/95 = 0.853
#
#     topic by stratum      sec          20/20 = 1.000
#                           corroborated 26/35 = 0.743
#                           single       29/40 = 0.725
#
#     extraction         tp   tn   fp   fn   wrong
#       company          34   37   17    3     4
#       amount_usd        3   90    0    2     0
#       round_type        0   95    0    0     0
#       headcount_delta   0   93    1    1     0
#       filing_type       8   75    0    0    12
#
# Three findings, all of which the stratified draw exists to make visible:
#
# 1. **SEC filings are 100% on topic and the worst on extraction.** `filing_type` is wrong on
#    12 of the 20 — the model reads the SEC *Item* number off the body (`3C`, `3(c)`) or
#    falls back to `8-K`, when the form type is the first token of the title. A uniform draw
#    would have been ~57% filings and would have published a topic accuracy near 0.9 earned
#    almost entirely on the half of the corpus that is trivially classifiable.
# 2. **`company` false-positives 17 times, and always the same way**: the publisher domain is
#    read as the subject. `github.com` becomes "GitHub", `clinch.sh` becomes "Clinch.sh",
#    `boxblanks.com` becomes "boxblanks.com". §7.3's field says "as named in the text", and
#    the labels hold that line, so this is the largest single error mode in the extraction.
# 3. **`round_type` never fires — 95 true negatives, no positives at all.** The field is
#    correct and the corpus has no funding-round language in it. That is the abstention
#    `enrich/schema.py` argues nullability exists for, measured rather than assumed.
#
# ## The floors
#
# Set 0.027 and 0.032 under the measured values. 95 examples × 7 decisions each is 269
# positive predictions, so one relabeled example moves either figure by ~0.004 — the floors
# absorb six or seven, which is the same reasoning `[dedup]` uses for not ratcheting tight.
# They exist to catch a regression, not to certify the number. Quote the full-set row.
#
# **Same labeler caveat as `[dedup]` and `[entities]`, and it is stronger here.** These labels
# were made by an LLM assistant and are stamped `unreviewed` in the data — no human has been
# over them. That is a model grading a model, and while the grader is a much larger one than
# the 8B being graded, it is not ground truth and the README must not quote it as though it
# were. `labeler` is on every record. Reviewing them is carried forward.
min_precision = 0.72
min_recall    = 0.75
